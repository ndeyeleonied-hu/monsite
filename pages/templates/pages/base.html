<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Saint-Louis du Sénégal{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <style>
    :root {
      --bleu: #0b4f6c;
      --ocre: #e0a030;
      --clair: #faf6ee;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--clair); color: #2b2b2b; }
    h1, h2, h3, .navbar-brand { font-family: 'Playfair Display', serif; }
    .navbar { background: var(--bleu); }
    .navbar .nav-link { color: #fff; margin-left: 12px; }
    .navbar .nav-link:hover { color: var(--ocre); }
    .btn-ocre { background: var(--ocre); color: #fff; border: none; }
    .btn-ocre:hover { background: #c78a20; color: #fff; }
    footer { background: var(--bleu); color: #fff; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fs-3" href="/">Saint-Louis</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'accueil' %}">Accueil</a>
<a class="nav-link" href="{% url 'decouvrir' %}">Découvrir</a>
          <a class="nav-link" href="#">Lieux</a>
          <a class="nav-link" href="{% url 'leaders' %}">Nos leaders</a>
          <a class="nav-link" href="#">Actualités</a>
          <a class="nav-link" href="#">Galerie</a>
          <a class="nav-link" href="#">Contact</a>
        </div>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="text-center py-4 mt-5">
    <p class="mb-1">Saint-Louis du Sénégal, patrimoine mondial de l'UNESCO</p>
    <p class="mb-0 small">© 2026 Tous droits réservés</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
